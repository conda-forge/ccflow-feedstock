schema_version: 1

context:
  name: ccflow
  version: "0.9.4"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/ca/e0/decead080f9d5d4377ef6c211f39f6074181e9d7793a518daf160709a148/ccflow-${{ version }}.tar.gz
  sha256: 566c45aeaab679728f561dbe8f629202ea6dbc300b4cbc137f6cf18290bacbec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cloudpathlib
    - cloudpickle
    - dask
    - deprecated
    - hydra-core
    - ipython
    - jinja2
    - narwhals
    - numpy <3
    - orjson
    - pandas
    - pyarrow
    - pydantic >=2.6,<3
    - smart_open
    - tenacity

tests:
  - python:
      imports:
        - ccflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: ccflow is a collection of tools for workflow configuration, orchestration, and dependency injection
  description: |
    ccflow is a collection of tools for workflow configuration, orchestration, and dependency injection
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/point72/ccflow

extra:
  recipe-maintainers:
    - hintse
    - arhamchopra
    - ptomecek
    - timkpaine
