schema_version: 1

context:
  name: ccflow
  version: "0.9.3"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/af/71/544a6ac2893e511a6b5b4be7d1129c59160f5b0b16ee802e2d93863adcc0/ccflow-${{ version }}.tar.gz
  sha256: 62a2116ddb67f272ed11d344f97994d6cd644ecd737bfed1049909cfc85320ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cloudpathlib
    - cloudpickle
    - dask
    - deprecated
    - hydra-core
    - ipython
    - jinja2
    - narwhals
    - numpy <3
    - orjson
    - pandas
    - pyarrow
    - pydantic >=2.6,<3
    - smart_open
    - tenacity

tests:
  - python:
      imports:
        - ccflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: ccflow is a collection of tools for workflow configuration, orchestration, and dependency injection
  description: |
    ccflow is a collection of tools for workflow configuration, orchestration, and dependency injection
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/point72/ccflow

extra:
  recipe-maintainers:
    - hintse
    - arhamchopra
    - ptomecek
    - timkpaine
