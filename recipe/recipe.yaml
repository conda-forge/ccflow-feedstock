schema_version: 1

context:
  name: ccflow
  version: "0.9.2"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/01/34/098cc28f469e5728b7d7e37615caadc81a8ef1d0a9a3ce8d54509743dd53/ccflow-${{ version }}.tar.gz
  sha256: db248580e96efb8217347ddee4610ddf90993a68f9a1d8e8b9d66409a8c5f8d4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - cloudpathlib
    - cloudpickle
    - dask
    - deprecated
    - hydra-core
    - ipython
    - jinja2
    - narwhals
    - numpy <3
    - orjson
    - pandas
    - pyarrow
    - pydantic >=2.6,<3
    - smart_open
    - tenacity

tests:
  - python:
      imports:
        - ccflow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: ccflow is a collection of tools for workflow configuration, orchestration, and dependency injection
  description: |
    ccflow is a collection of tools for workflow configuration, orchestration, and dependency injection
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/point72/ccflow

extra:
  recipe-maintainers:
    - arhamchopra
    - ptomecek
    - timkpaine
